<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0b09">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex">
    <title>Messages · Bros before Boges</title>
    <link rel="stylesheet" href="style.css?v=2027.12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* One page, two panes: the conversations and the open one. On a phone only one shows at a time. */
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        html, body { height: 100%; }
        body.app-page { min-height: 100%; }
        .site-header { padding: calc(12px + env(safe-area-inset-top)) 0 12px; background: rgba(14, 11, 9, 0.97); }
        .site-header .logo { font-size: 1.4rem; line-height: 1.6; white-space: nowrap; }
        .msg-main {
            max-width: 1080px;
            margin: 0 auto;
            padding: calc(var(--hdr, 72px) + 16px) 16px calc(16px + env(safe-area-inset-bottom));
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .msg-gate {
            margin: 40px auto;
            max-width: 460px;
            padding: 28px 24px;
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            background: var(--glass-bg);
            text-align: center;
        }
        .msg-gate h2 { margin: 0 0 10px; font-family: var(--font-heading); font-size: 1.5rem; }
        .msg-gate p { margin: 0 0 18px; color: var(--text-muted); line-height: 1.5; }
        .msg-gate .btn { display: inline-flex; min-height: 44px; align-items: center; }

        .msg-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 0;
            height: calc(100dvh - var(--hdr, 72px) - 32px - env(safe-area-inset-bottom));
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            background: var(--glass-bg);
            overflow: hidden;
        }
        .msg-list { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--glass-border); }
        .msg-list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 16px 12px; }
        .msg-list-head h2 { margin: 0; font-family: var(--font-heading); font-size: 1.5rem; }
        .msg-new {
            min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(251, 191, 36, 0.45);
            background: transparent; color: var(--accent-gold); font: 600 0.9rem var(--font-body); cursor: pointer;
        }
        .msg-new:hover { background: rgba(251, 191, 36, 0.08); }
        .msg-push { margin: 0 16px 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); font-size: 0.86rem; line-height: 1.45; color: var(--text-muted); }
        .msg-push button { margin-top: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--accent-gold); color: #1a0f08; font: 700 0.85rem var(--font-body); cursor: pointer; }
        .conv-list { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; flex: 1; }
        .conv-item button {
            width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline;
            padding: 12px 10px; border: 0; border-radius: 12px; background: transparent; color: inherit; text-align: left; cursor: pointer; font: inherit;
        }
        .conv-item button:hover { background: rgba(255, 255, 255, 0.04); }
        .conv-item button[aria-current="true"] { background: rgba(251, 191, 36, 0.09); }
        .conv-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .conv-time { color: var(--text-muted); font-size: 0.78rem; }
        .conv-preview { grid-column: 1 / -1; color: var(--text-muted); font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .conv-item.is-unread .conv-preview { color: var(--text-main); font-weight: 600; }
        .conv-badge { display: inline-block; min-width: 20px; height: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent-gold); color: #1a0f08; font-size: 0.72rem; font-weight: 800; line-height: 20px; text-align: center; vertical-align: 2px; }
        .conv-empty { padding: 18px 12px; color: var(--text-muted); line-height: 1.5; font-size: 0.92rem; }

        .msg-thread { display: flex; flex-direction: column; min-height: 0; }
        .thread-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--glass-border); min-height: 64px; box-sizing: border-box; }
        .thread-head h3 { margin: 0; font-family: var(--font-heading); font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .thread-back { display: none; min-width: 44px; min-height: 44px; border: 0; border-radius: 999px; background: transparent; color: var(--text-main); font-size: 1.4rem; cursor: pointer; }
        .thread-scroll { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
        .thread-empty { margin: auto; max-width: 320px; color: var(--text-muted); text-align: center; line-height: 1.5; }
        .thread-more { align-self: center; min-height: 36px; padding: 0 14px; margin-bottom: 6px; border: 1px solid var(--glass-border); border-radius: 999px; background: transparent; color: var(--text-muted); cursor: pointer; font: 600 0.82rem var(--font-body); }
        .day-sep { align-self: center; margin: 10px 0 4px; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
        .bubble { max-width: min(78%, 520px); display: flex; flex-direction: column; }
        .bubble.mine { align-self: flex-end; align-items: flex-end; }
        .bubble.theirs { align-self: flex-start; align-items: flex-start; }
        .bubble-text {
            margin: 0; padding: 9px 13px; border-radius: 18px; line-height: 1.4; font-size: 0.97rem;
            white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
        }
        .bubble.mine .bubble-text { background: #e27d4f; color: #1a0f08; border-bottom-right-radius: 6px; }
        .bubble.theirs .bubble-text { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border-bottom-left-radius: 6px; }
        .bubble-meta { display: flex; gap: 8px; align-items: center; margin: 3px 6px 2px; color: var(--text-muted); font-size: 0.72rem; }
        .bubble-meta button { min-height: 28px; padding: 0 4px; border: 0; background: transparent; color: var(--text-muted); font: 600 0.72rem var(--font-body); text-decoration: underline; cursor: pointer; }
        .bubble.is-pending { opacity: 0.6; }

        .composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--glass-border); }
        .composer textarea {
            flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 11px 14px; box-sizing: border-box;
            border: 1px solid var(--glass-border); border-radius: 22px; background: rgba(255, 255, 255, 0.05); color: var(--text-main);
            font: 16px/1.35 var(--font-body);
        }
        .composer textarea:focus { outline: 2px solid rgba(251, 191, 36, 0.6); outline-offset: 1px; }
        .composer button { min-width: 64px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: var(--accent-gold); color: #1a0f08; font: 700 0.95rem var(--font-body); cursor: pointer; }
        .composer button[disabled] { opacity: 0.55; cursor: default; }
        .composer-note { margin: 0; padding: 0 16px 8px; color: var(--text-muted); font-size: 0.8rem; min-height: 0; }
        .composer-note.is-error { color: #f87171; }
        .composer-note:empty { display: none; }

        /* New message: pick who */
        .pick { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0.6); }
        .pick[hidden] { display: none; }
        .pick-card { width: min(480px, 100%); max-height: 80vh; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; background: var(--primary-bg-alt); border: 1px solid var(--glass-border); padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); box-sizing: border-box; }
        @media (min-width: 700px) { .pick { align-items: center; } .pick-card { border-radius: 20px; } }
        .pick-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .pick-head h3 { margin: 0; font-family: var(--font-heading); }
        .pick-close { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }
        .pick-filter { width: 100%; min-height: 44px; padding: 0 14px; box-sizing: border-box; border: 1px solid var(--glass-border); border-radius: 12px; background: rgba(255, 255, 255, 0.05); color: var(--text-main); font: 16px var(--font-body); }
        .pick-list { list-style: none; margin: 10px 0 0; padding: 0; overflow-y: auto; }
        .pick-list button { width: 100%; min-height: 48px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--text-main); text-align: left; font: 600 1rem var(--font-body); cursor: pointer; }
        .pick-list button:hover, .pick-list button:focus-visible { background: rgba(255, 255, 255, 0.06); }

        @media (max-width: 760px) {
            .msg-main { padding-left: 0; padding-right: 0; padding-bottom: 0; }
            .msg-layout { grid-template-columns: 1fr; border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0;
                          height: calc(100dvh - var(--hdr, 72px) - 16px); }
            .msg-layout[data-view="list"] .msg-thread { display: none; }
            .msg-layout[data-view="thread"] .msg-list { display: none; }
            .msg-list { border-right: 0; }
            .thread-back { display: inline-flex; align-items: center; justify-content: center; }
            .bubble { max-width: 84%; }
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="bbb-logo.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>

<body class="app-page">
    <header class="site-header">
        <div class="container header-container">
            <h1 class="logo"><a class="logo-link" href="index.html" aria-label="Bros before Boges home">Bros before <span class="accent">Boges</span></a></h1>
            <nav class="main-nav" aria-label="Site">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="bookie.html">The Bookie</a></li>
                    <li><a href="round_tracker.html#board">Live scores</a></li>
                    <li><a href="privacy.html">Privacy</a></li>
                </ul>
            </nav>
            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <main class="msg-main" id="main">
        <!-- Signed out, waiting for approval, being set up, or couldn't load: one card says which (messages.js) -->
        <section class="msg-gate" id="msg-gate" aria-live="polite">
            <h2 id="gate-title">Messages</h2>
            <p id="gate-text">One sec, checking your login…</p>
            <a class="btn btn-primary" id="gate-action" href="bookie.html?next=messages&amp;mode=login" hidden>Log in</a>
        </section>

        <div class="msg-layout" id="msg-layout" data-view="list" hidden>
            <aside class="msg-list" aria-labelledby="list-title">
                <div class="msg-list-head">
                    <h2 id="list-title">Messages</h2>
                    <button type="button" class="msg-new" id="msg-new">New message</button>
                </div>
                <div class="msg-push" id="msg-push" hidden>
                    <span id="msg-push-text">Turn on notifications to hear about new messages on this phone.</span>
                    <div><button type="button" id="msg-push-btn">Turn on</button></div>
                </div>
                <ul class="conv-list" id="conv-list" aria-label="Conversations"></ul>
            </aside>

            <section class="msg-thread" aria-labelledby="thread-title">
                <div class="thread-head">
                    <button type="button" class="thread-back" id="thread-back" aria-label="Back to conversations">‹</button>
                    <h3 id="thread-title">Pick a conversation</h3>
                </div>
                <div class="thread-scroll" id="thread-scroll" aria-live="polite">
                    <p class="thread-empty" id="thread-empty">Pick someone on the left, or start one with <b>New message</b>.</p>
                </div>
                <p class="composer-note" id="composer-note" role="status"></p>
                <form class="composer" id="composer" hidden>
                    <label class="sr-only" for="composer-text">Message</label>
                    <textarea id="composer-text" rows="1" maxlength="1000" placeholder="Message" autocomplete="off" enterkeyhint="send"></textarea>
                    <button type="submit" id="composer-send">Send</button>
                </form>
            </section>
        </div>
    </main>

    <!-- New message: who to -->
    <div class="pick" id="pick" hidden role="dialog" aria-modal="true" aria-labelledby="pick-title">
        <div class="pick-card">
            <div class="pick-head">
                <h3 id="pick-title">New message</h3>
                <button type="button" class="pick-close" id="pick-close" aria-label="Close">×</button>
            </div>
            <label class="sr-only" for="pick-filter">Find a player</label>
            <input type="search" id="pick-filter" class="pick-filter" placeholder="Find a player" autocomplete="off">
            <ul class="pick-list" id="pick-list"></ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script src="trip-config.js?v=2027.19"></script>
    <script src="push.js?v=2027.19"></script>
    <script src="bell.js?v=2027.1"></script>
    <script src="messages.js?v=2027.2"></script>
</body>

</html>
